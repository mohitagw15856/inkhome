; Inkhome simulator environments for crosspoint-simulator (MIT, Julia Nguyen):
; https://github.com/crosspoint-reader/crosspoint-simulator
; Used by scripts/inkhome/screenshots.sh, which copies the tree to a scratch
; folder and drops this file in as platformio.local.ini. The simulator is
; pinned to a commit that matches the upstream base (CrossPoint 1.6.5).

[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
  +<*>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -D_LIBCPP_DISABLE_AVAILABILITY
  -DSIMULATOR
  -DFREEINK_DEVICE_X4=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets
extra_scripts =
  pre:scripts/gen_i18n.py
  pre:scripts/build_html.py
lib_deps =
  simulator=symlink://../crosspoint-simulator
  JsonSax=symlink://freeink-sdk/libs/network/JsonSax
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  BleKeyboardHost=symlink://freeink-sdk/libs/network/BleKeyboardHost
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  https://github.com/bitbank2/AnimatedGIF.git#d01888f0255fd0781fc2b8600b9111b14c999584
  links2004/WebSockets @ 2.7.3

[env:simulator_x3]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_X3
  -DFREEINK_DEVICE_X3=1
