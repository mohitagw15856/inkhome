name: Inkhome release

# Builds the single X3/X4 (ESP32-C3) binary when a release is published and
# attaches two assets:
#   inkhome-<tag>-x3-x4.bin          app image for OTA and SD-card updates
#   inkhome-<tag>-x3-x4-factory.bin  full image (bootloader, partitions, app) for a USB flash
# It then publishes the web flasher (docs/flash) with the app image to GitHub Pages; the
# flasher writes it beside the stock firmware.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inkhome-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository != 'crosspoint-reader/crosspoint-reader'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          submodules: recursive

      - name: Read and validate version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          configured="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ -n "$RELEASE_TAG" ]; then
            test "${RELEASE_TAG#v}" = "$configured"
          fi
          echo "version=$configured" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          pio pkg install -e gh_release
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Build gh_release
        run: |
          set -o pipefail
          pio run -e gh_release -j1 | tee pio.log

      - name: Size summary
        run: |
          {
            echo "## Inkhome ${{ steps.version.outputs.version }}"
            grep -E "RAM:\s|Flash:\s" pio.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage assets
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist site
          cp .pio/build/gh_release/firmware.bin "dist/inkhome-${v}-x3-x4.bin"
          cp .pio/build/gh_release/firmware.factory.bin "dist/inkhome-${v}-x3-x4-factory.bin"
          cp -r docs/flash/. site/
          mkdir -p site/images && cp docs/images/inkhome/*.png site/images/
          cp .pio/build/gh_release/firmware.bin site/inkhome-x3-x4.bin
          printf '{"version":"%s"}\n' "$v" > site/version.json

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.bin --repo "$GITHUB_REPOSITORY" --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
